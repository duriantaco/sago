name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install fyn
      - run: fyn sync --group dev
      - run: fyn run lint
      - run: fyn run format-check
      - run: fyn run typecheck
      - run: fyn run pytest --cov=sago --cov-report=term-missing
